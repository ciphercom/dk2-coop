name: Build DK2 Co-op

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, and package
        shell: cmd
        run: build.cmd --package --${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        with:
          name: DK2-Coop-${{ matrix.configuration }}
          path: |
            build/releases/*.zip
            build/releases/*.zip.sha256
          if-no-files-found: error

  # Tags prepare a reviewable draft; publishing remains a maintainer action.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DK2-Coop-release
          path: release
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "DK2 Co-op $RELEASE_TAG"
